services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gtu-nav-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./gtu_nav.db
    volumes:
      - ./backend/app/data:/app/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gtu-nav-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
